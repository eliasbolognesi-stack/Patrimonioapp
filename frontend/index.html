<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patrimônio — Gestão de Bens</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23b91c1c'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Segoe UI'>P</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===================== LOGIN ===================== -->
  <div id="login-screen" class="login-screen hidden">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark">P</div>
        <h1>Patrimônio</h1>
        <p>Sistema de Gestão de Bens Patrimoniais</p>
      </div>
      <form id="login-form" autocomplete="off">
        <div class="field">
          <label for="login-username">Usuário</label>
          <input type="text" id="login-username" placeholder="seu usuário" required autofocus>
        </div>
        <div class="field">
          <label for="login-password">Senha</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <div id="login-error" class="login-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Entrar</button>
      </form>
      <div class="login-hint">Acesso padrão: <strong>admin</strong> / <strong>admin123</strong></div>
    </div>
  </div>

  <!-- ===================== APP ===================== -->
  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">P</div>
        <div>
          <strong>Patrimônio</strong>
          <span>Gestão de Bens</span>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <span class="nav-section">Geral</span>
        <a href="#/dashboard" data-page="dashboard">
          <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
          Dashboard
        </a>
        <a href="#/bens" data-page="bens">
          <svg viewBox="0 0 24 24"><path d="M20 7h-4V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2zM10 5h4v2h-4V5z"/></svg>
          Bens
        </a>
        <span class="nav-section">Operações</span>
        <a href="#/movimentacoes" data-page="movimentacoes">
          <svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
          Movimentações
        </a>
        <a href="#/manutencoes" data-page="manutencoes">
          <svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
          Manutenções
        </a>
        <a href="#/baixas" data-page="baixas">
          <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
          Baixas
        </a>
        <span class="nav-section">Cadastros</span>
        <a href="#/categorias" data-page="categorias">
          <svg viewBox="0 0 24 24"><path d="M12 2l-5.5 9h11L12 2zm0 3.84L13.93 9h-3.87L12 5.84zM17.5 13c-2.49 0-4.5 2.01-4.5 4.5s2.01 4.5 4.5 4.5 4.5-2.01 4.5-4.5-2.01-4.5-4.5-4.5zM3 21.5h8v-8H3v8z"/></svg>
          Categorias
        </a>
        <a href="#/setores" data-page="setores">
          <svg viewBox="0 0 24 24"><path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10z"/></svg>
          Setores
        </a>
        <span class="nav-section">Sistema</span>
        <a href="#/relatorios" data-page="relatorios">
          <svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
          Relatórios
        </a>
        <a href="#/usuarios" data-page="usuarios" id="nav-usuarios" class="hidden">
          <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
          Usuários
        </a>
      </nav>

      <div class="sidebar-user">
        <div class="user-avatar" id="user-avatar">A</div>
        <div class="user-info">
          <strong id="user-name">—</strong>
          <span id="user-role">—</span>
        </div>
        <button class="btn-icon" id="logout-btn" title="Sair">
          <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8v-2H4V5z"/></svg>
        </button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <h2 id="page-title">Dashboard</h2>
        <div class="topbar-right" id="topbar-actions"></div>
      </header>
      <div class="page-content" id="page-content"></div>
    </main>
  </div>

  <!-- modal e toasts -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal" id="modal-box"></div>
  </div>
  <div id="toast-container" class="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
